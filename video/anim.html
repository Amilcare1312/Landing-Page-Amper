 {const fg=g.createLinearGradient(0,base-420,0,base);fg.addColorStop(0,'rgba(30,50,90,0)');fg.addColorStop(1,'rgba(40,65,110,.28)');g.fillStyle=fg;g.fillRect(0,base-420,W,420)}

 g.beginPath();g.moveTo(cx+255,cy+60);g.lineTo(cx+255,cy+20);g.lineTo(ax+300,cy+20);g.lineTo(ax+300,ay+ah-5);g.stroke();
